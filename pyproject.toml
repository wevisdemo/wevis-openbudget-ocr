[project]
name = "openbudget_ocr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "PyMuPDF", 
    "toc_extractor",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
toc_extractor = { path = "openbudget-toc-extractor", editable = true }