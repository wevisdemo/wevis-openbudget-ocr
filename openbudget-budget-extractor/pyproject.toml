[project]
name = "thai_budget_extractor"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "tqdm",
    "PyMuPDF", "numpy", "opencv-python==4.10.0.84", "pandas", "pillow",
    "torch", "torchvision", "accelerate", "easyocr"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true